[pytest]
# Collect ONLY tests/ and ONLY test_*.py. pytest's defaults also collect
# *_test.py anywhere under the root, and the root is exactly where one-off
# probe scripts tend to get dropped — a probe named like `_x_write_test.py`
# that does a live API write at import time would run just by being collected.
testpaths = tests
python_files = test_*.py

# Put the repo root on sys.path so `pytest`, `pytest tests/test_x.py` and
# `python -m pytest` all import the top-level scripts the same way. Without
# this, bare `pytest` only worked when a test collected early happened to
# insert the root itself.
pythonpath = .
